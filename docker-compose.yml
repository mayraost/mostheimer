# Coolify deployment (Docker Compose):
# 1. In Coolify: New Resource -> Docker Compose (Empty), connect this repo.
# 2. Use this file as the compose file.
# 3. Set the environment (see .env.example): APP_PORT must be free on the
#    Coolify host (other stacks use ~3100/3200, so 3300 here).
# 4. Assign the domain to service "app" in Coolify (docker_compose_domains).
#    The Coolify proxy (Traefik) routes via the published host port, NOT via
#    the compose network.
# 5. Do not declare extra networks: the only external one is
#    coolify-postgres-net (shared central Postgres instance). No app-owned
#    Postgres container, no published Postgres ports.
# 6. DATABASE_URL is set as a Coolify app env, not here — a compose
#    `environment` entry would override the app env. Host is the service name
#    `coolify-postgres` inside coolify-postgres-net.
# 7. PAYLOAD_SECRET likewise comes in as a Coolify app env. Do NOT add a
#    ${PAYLOAD_SECRET:?} reference: Coolify also injects app/compose envs as
#    build args, which made the value readable in the image's docker history.
# 8. Payload media uploads land in /app/public/media and persist in the
#    media-data volume across re-deploys.

services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - coolify-postgres-net
    ports:
      - '${APP_PORT:-3300}:3000'
    volumes:
      - media-data:/app/public/media

networks:
  coolify-postgres-net:
    external: true

volumes:
  media-data:
