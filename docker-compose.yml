# Coolify-Deployment (Docker Compose):
# 1. In Coolify: New Resource -> Docker Compose (Empty), dieses Repo verbinden.
# 2. Diese Datei als Compose-File angeben.
# 3. Environment setzen (siehe .env.example): APP_PORT muss auf dem
#    Coolify-Host frei sein (Port-Konflikte mit anderen Stacks vermeiden,
#    internal-dashboard nutzt ~3100, halloween-counter 3200 → hier 3300).
# 4. Domain in Coolify dem Service "app" zuweisen (docker_compose_domains),
#    z. B. https://mosthi.de – der Coolify-Proxy (Traefik) routet
#    über den published Host-Port, NICHT über das Compose-Network.
# 5. KEIN implizites Projekt-Default-Netz als Deklaration ergänzen; einziges
#    externes Netz ist coolify-postgres-net (zentrale geteilte Postgres-
#    Instanz coolify-postgres, siehe AGENTS.md-Standard vom 31.10.2026): keine
#    app-eigenen Postgres-Container mehr, keine Port-Publishings für Postgres.
# 6. DATABASE_URL wird NICHT im Compose gesetzt – Coolify liefert sie als
#    App-Env (postgresql://<user>:<pw>@coolify-postgres:5432/<db>; Service-
#    Name coolify-postgres im Netz coolify-postgres-net). Compose-environment
#    würde App-Envs überschreiben, deshalb fehlt sie hier bewusst.
# 7. PAYLOAD_SECRET kommt als Coolify-App-Env direkt in den Container – KEINE
#    ${PAYLOAD_SECRET:?}-Referenz im Compose: Coolify injiziert App-/Compose-Envs
#    zusätzlich als Build-ARGs, wodurch der Wert im docker history des Images
#    lesbar war (Leak, rotiert 01.11.2026). Runtime-Injektion über App-Env
#    reicht (gleiches Pattern wie DATABASE_URL oben).
# 8. Payload-Media-Uploads landen in /app/public/media und persistieren
#    im Volume media-data (überleben Re-Deploys).

services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - coolify-postgres-net
    ports:
      - '${APP_PORT:-3300}:3000'
    volumes:
      - media-data:/app/public/media

networks:
  coolify-postgres-net:
    external: true

volumes:
  media-data:
